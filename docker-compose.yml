services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bookrec-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookrec}
      POSTGRES_USER: ${POSTGRES_USER:-bookrec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookrec}
    volumes:
      - bookrec_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  bookrec_pgdata:



